# Keeps the download instructions pointing at the current release.
# The docs name release assets literally (owl-sidecar-0.1.0-macos-arm64.tar.gz),
# so every release leaves them one version behind and users download a file that
# no longer exists.
#
# Runs after a release is published, and can be run by hand to repair drift.
name: Sync release version in docs

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to write, without a leading v (e.g. 0.2.0). Defaults to the latest published release."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: sync-release-version
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the default branch, not the tag. A release event leaves the
          # runner on a detached tag, and a commit there would go nowhere.
          ref: ${{ github.event.repository.default_branch }}

      - name: Resolve version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.version }}" ]; then
            VER="${{ inputs.version }}"
          elif [ -n "${{ github.event.release.tag_name }}" ]; then
            VER="${{ github.event.release.tag_name }}"
          else
            VER="$(gh release view --json tagName -q .tagName)"
          fi
          VER="${VER#v}"
          # Refuse anything that is not a plain semver. This string is spliced
          # into documented shell commands; a malformed or injected value would
          # be published as an instruction users copy and paste.
          case "$VER" in
            [0-9]*.[0-9]*.[0-9]*) : ;;
            *) echo "::error::refusing to write a non-semver version: '$VER'"; exit 1 ;;
          esac
          if ! printf '%s' "$VER" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::refusing to write a malformed version: '$VER'"; exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VER"

      - name: Rewrite asset names in docs
        id: rewrite
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          # Only rewrite the ANCHORED asset-name pattern. A bare s/0.1.0/$VER/g
          # would also rewrite unrelated version numbers - dependency versions,
          # kernel versions, anything in a changelog.
          FILES=$(git ls-files '*.md' | tr '\n' ' ')
          for f in $FILES; do
            perl -pi -e "s/owl-sidecar-\d+\.\d+\.\d+-/owl-sidecar-${VER}-/g" "$f"
          done
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Docs already reference $VER; nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat
          fi

      - name: Report version strings this job did not touch
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          # Surface anything version-shaped that is NOT part of an asset name, so
          # a stale reference cannot hide behind a green run. Reported, not failed:
          # a changelog is allowed to mention older versions.
          LEFT=$(git ls-files '*.md' \
            | xargs grep -noE '[0-9]+\.[0-9]+\.[0-9]+' 2>/dev/null \
            | grep -v "owl-sidecar-${VER}-" \
            | grep -vE ":${VER}\$" || true)
          {
            echo "### Version sync"
            echo ""
            echo "Wrote \`${VER}\` into release asset names."
            if [ -n "$LEFT" ]; then
              echo ""
              echo "Version-shaped strings outside asset names — check whether any should have moved:"
              echo ""
              echo '```'
              echo "$LEFT"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit
        if: steps.rewrite.outputs.changed == 'true'
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # skip ci: this commit only edits docs, and re-running the pipeline on
          # it would be noise.
          git commit -m "docs: point install instructions at ${VER} [skip ci]"
          git push
